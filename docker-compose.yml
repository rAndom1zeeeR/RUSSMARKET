# Dokploy: Compose, then Domains → service "app", container port = PORT from .env (default 3000).
# The database is an external Postgres: set DATABASE_URL (postgresql://user:password@host:5432/db) in the Dokploy
# environment. The compose file refuses to start without it. No volume: the app keeps no state on disk.
# Tables and seed data are created once from outside, see "Деплой" in README.md (`pnpm db:setup`).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL (postgresql://…) is required}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
    expose:
      - "${PORT:-3000}"
    networks:
      - dokploy-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  dokploy-network:
    external: true
