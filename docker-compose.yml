# Dokploy: Compose, then Domains → service "app", container port = PORT from .env (default 3003).
# SQLite is the volume. One replica only — a second process corrupts the file.
# Do not override DATABASE_URL with file:./prisma/data/dev.db: that path dies on redeploy.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: file:/data/app.db
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3003}
    volumes:
      - app-data:/data
    expose:
      - "${PORT:-3003}"
    networks:
      - dokploy-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3003)).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  app-data:

networks:
  dokploy-network:
    external: true
